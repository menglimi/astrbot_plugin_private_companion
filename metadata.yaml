name: astrbot_plugin_private_companion
display_name: 我会永远陪着你
author: menglimi
author_url: https://github.com/menglimi
description: 面向 AstrBot 的持续型 AI 陪伴核心。统一管理角色状态、日程、关系、私聊与群聊理解、主动消息编排及运行诊断；设备与记忆能力仅按用户授权提供状态展示。
desc: 基于持续生活模拟的 AstrBot 陪伴核心，负责陪伴主链、关系边界、临时情绪、主动调度与本地配置管理。
repo: https://github.com/menglimi/astrbot_plugin_private_companion
category: AI 增强
tags:
  - 陪伴
  - 生活模拟
  - AI 增强
  - 记忆管理
  - 主动行为
  - 多模态
  - 可视化管理
help: |
  私聊发送：
  - 陪伴 状态
  - 陪伴 查看主动判定
  - 陪伴 撤回消息
  - 自然询问刚才撤回了什么
  - 陪伴 重置插件
  - 陪伴 增添状态（状态描述，可选持续小时）
  - 陪伴 查看今日日程
  - 陪伴 重置日程
  - 陪伴 当前细化
  - 陪伴 重置细化
  - 陪伴 能力列表
  - 陪伴 答疑（现象或问题；例如：刚才群里为什么没回我）
  - 陪伴 答疑确认 / 答疑取消（仅在答疑给出待确认改动时使用）
  - 陪伴 答疑设置（配置项／中文名）（值；管理员直接调参）
  - 陪伴 TTS语种（日语／中文／英语／默认）
  - 陪伴 绑定城市（城市／区县,城市／LocationID）
  - 陪伴 查看城市 / 解绑城市
  - 陪伴 重置夹层密码
  - 陪伴 输出夹层密码
  - 陪伴 强制输出 夹层密码
  - 陪伴 查看提示词（日程／细化／主动／回复注入）
  - 陪伴 生成状态
  - 陪伴 梦境
  - 陪伴 梦境碎片
  - 陪伴 画像
  - 陪伴 记忆
  - 陪伴 表达学习
  - 陪伴 气氛
  - 陪伴 片段
  - 陪伴 长期记忆（查看已授权摘要）
  - 陪伴 日记
  - 陪伴 生成日记
  - 陪伴 创作（启用本地创作功能后使用）
  - 陪伴 创作 开始（灵感）
  - 陪伴 创作 续写（作品）
  - 陪伴 创作 查看（作品）
  - 陪伴 创作 分享（作品）
  - 陪伴 日期列表
  - 陪伴 日期添加（标题）（YYYY-MM-DD 或 MM-DD；可选备注）
  - 陪伴 日期删除（标题关键词）
  - 陪伴 可做事项
  - 陪伴 昵称（称呼）
  - 陪伴 语气（简短语气描述）
  - 陪伴 参考图（本地图片路径／图片URL／清空／查看）
  - 陪伴 参考图库 添加（用途注释；可同时携带多张图）
  - 陪伴 参考图库 列表／预览（编号）／删除（编号）／清空
  - 陪伴 清空记忆

  群聊发送：
  - 陪伴群 状态
  - 陪伴群 撤回消息
  - 群聊自然询问刚才撤回了什么
  - 陪伴群 黑话
  - 陪伴群 群友
  - 陪伴群 话题
  - 陪伴群 片段
  - 陪伴群 插话反馈
  - 陪伴群 关系网
  - 陪伴群 LLM状态
  - 陪伴群 关闭LLM
  - 陪伴群 开启LLM
  - 陪伴群 开启
  - 陪伴群 关闭

  “陪伴 答疑”按照“现象 → 当前证据 → 建议检查”的顺序提供诊断。为提高判断准确性，建议同时说明问题发生的会话、实际表现和大致时间。只有在明确询问配置项时，答疑才会生成待确认的修改建议；“陪伴 答疑确认”应用最近一次建议，“陪伴 答疑取消”放弃该建议。

  私聊陪伴默认启用。在私聊目标用户中填写平台用户 ID 后，插件会为主动消息链路建立目标映射：OneBot 通常填写 QQ 号，QQ 官方机器人填写 openid 或平台用户 ID。群聊陪伴默认采用白名单模式，并遵守每日额度、最小间隔、免打扰时段和群聊插话冷却。设备、图片、语音和记忆相关能力均需用户明确授权；未启用时只展示本地状态，不会主动访问外部内容或设备。
