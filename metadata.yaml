name: astrbot_plugin_private_companion
display_name: 我会永远陪着你
author: menglimi
version: 7.0.12
repo: https://github.com/menglimi/astrbot_plugin_private_companion
description: 将一切串联成角色的生活，一站式互联拟人化插件。普通对话沿用 AstrBot 核心回复管线，融合连续会话、记忆、生活与主动联系；随包内置 Content 创作、Image 生图、Screen 识屏、Reality 现实触及、Together 共同陪伴、Game 游戏、Live 直播七项能力，并由「陪伴小屋」统一管理。角色可设全局默认，私聊用户与群聊独立细调。
desc: 将一切串联成角色的生活，一站式互联拟人化插件；整合记忆、主动联系与七项内置能力，支持私聊群聊细调。
help: |
  私聊功能指令：
  - 陪伴 帮助 / 状态 / 能力列表 / 日程 / 主动判定
  - 生成日程 / 刷新日程 / 重新生成日程
  - 陪伴 日记 / 梦境 / 记忆（线索）/ 长期记忆（线索）/ 片段（线索）/ 画像
  - 陪伴 答疑（问题）/ 陪伴画图（描述）/ 陪伴合照（修改要求）

  群聊功能指令：
  - 陪伴群 帮助 / 状态 / 话题
  - 陪伴群 黑话（词）/ 片段（线索）

  配置、授权、清空与重置操作请在「陪伴小屋」对应页面完成。聊天功能指令由 AstrBot 普通回复主链和本轮授权工具执行。
category: AI 增强
tags:
  - 陪伴
  - 角色扮演
  - 体素小屋
  - 能力整合
support_platforms:
  - aiocqhttp
  - qq_official
  - qq_official_webhook
astrbot_version: ">=4.27.2"
