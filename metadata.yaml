name: astrbot_plugin_private_companion
display_name: 我会永远陪着你
author: menglimi
author_url: https://github.com/menglimi
description: 面向 AstrBot、以持续生活模拟为基础的全方位 AI 能力强化陪伴插件。它以人格、状态、日程、关系与本地陪伴资料构成生活底座，再统一强化私聊与群聊理解、主动行为、多模态交互、内容探索与创作、模型 Provider 编排和可视化诊断。插件自身只维护轻量画像、近期片段和运行状态；跨会话长期记忆、历史导入与深度召回依赖已适配的外部记忆插件。
desc: 以持续生活模拟为底座，强化主动行为、多模态交互、内容探索、创作、模型编排与运行诊断；长期记忆由外部记忆插件联动提供。
repo: https://github.com/menglimi/astrbot_plugin_private_companion
category: AI 增强
tags:
  - 陪伴
  - 生活模拟
  - AI 增强
  - 记忆联动
  - 主动行为
  - 多模态
  - 可视化管理
help: |
  私聊发送：
  - 陪伴 状态
  - 陪伴 查看主动判定
  - 陪伴 撤回消息
  - 自然询问刚才撤回了什么
  - 陪伴 重置插件
  - 陪伴 增添状态（状态描述，可选持续小时）
  - 陪伴 查看今日日程
  - 陪伴 重置日程
  - 陪伴 当前细化
  - 陪伴 重置细化
  - 陪伴 能力列表
  - 陪伴 答疑（现象或问题；例如：刚才群里为什么没回我）
  - 陪伴 答疑确认 / 答疑取消（仅在答疑给出待确认改动时使用）
  - 陪伴 答疑设置（配置项／中文名）（值；管理员直接调参）
  - 陪伴 TTS语种（日语／中文／英语／默认）
  - 陪伴 绑定城市（城市／区县,城市／LocationID）
  - 陪伴 查看城市 / 解绑城市
  - 陪伴 重置夹层密码
  - 陪伴 输出夹层密码
  - 陪伴 强制输出 夹层密码
  - 陪伴 查看提示词（日程／细化／主动／回复注入）
  - 陪伴 生成状态
  - 陪伴 梦境
  - 陪伴 梦境碎片
  - 陪伴 画像
  - 陪伴 记忆
  - 陪伴 表达学习
  - 陪伴 气氛
  - 陪伴 片段
  - 陪伴 长期记忆（查询外部记忆插件）
  - 陪伴 日记
  - 陪伴 生成日记
  - 陪伴 日期列表
  - 陪伴 日期添加（标题）（YYYY-MM-DD 或 MM-DD；可选备注）
  - 陪伴 日期删除（标题关键词）
  - 陪伴 可做事项
  - 陪伴 昵称（称呼）
  - 陪伴 语气（简短语气描述）
  - 陪伴 参考图（本地图片路径／图片URL／清空／查看）
  - 陪伴 参考图库 添加（用途注释；可同时携带多张图）
  - 陪伴 参考图库 列表／预览（编号）／删除（编号）／清空
  - 陪伴 清空记忆

  群聊发送：
  - 陪伴群 状态
  - 陪伴群 撤回消息
  - 群聊自然询问刚才撤回了什么
  - 陪伴群 黑话
  - 陪伴群 群友
  - 陪伴群 话题
  - 陪伴群 片段
  - 陪伴群 插话反馈
  - 陪伴群 关系网
  - 陪伴群 LLM状态
  - 陪伴群 关闭LLM
  - 陪伴群 开启LLM
  - 陪伴群 开启
  - 陪伴群 关闭

  答疑会优先按“现象 → 当前证据 → 一步检查”排查，不会默认罗列整套配置。描述发生位置、Bot 的实际行为和大概时间会更准确；只有明确询问配置/参数时才会附带待确认的改动建议。`答疑确认`只应用刚才那次已生成的建议，`答疑取消`会丢弃它。\n\n  本插件以持续生活模拟为底座，并统一强化私聊、群聊、主动行为、多模态交互和内容生活。私聊陪伴默认开启；插件私聊目标用户里填写平台用户 ID 后会自动预热主动消息，OneBot 通常填 QQ 号，QQ 官方机器人通常填 openid/平台用户 ID。群聊陪伴支持白名单/黑名单模式,默认白名单,不会主动抢话。插件遵守每日上限、最小间隔、免打扰时间、群聊插话间隔和主动生图额度。看屏幕、生图、戳一戳、语音、QQ 状态同步、B站 AI Bot、SDGen 等联动能力都是可选项,缺失时会自动跳过或回退。
