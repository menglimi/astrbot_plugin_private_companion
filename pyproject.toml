[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astrbot-plugin-private-companion"
version = "7.0.13"
description = "我会永远陪着你 integrated companion host"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
# AstrBot installs requirements.txt directly; deriving Requires-Dist from the same
# file keeps the built package metadata and the runtime install contract identical.
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["companion_v2*"]
