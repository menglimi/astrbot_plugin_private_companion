    /* 主题引导：在样式生效前应用已保存的显示维度，避免刷新时的主题闪烁。
       与 product-page.js 的 appearance 存储保持同一组键，读取失败时静默用默认值。

       这里刻意内联、不引 theme.js：引导必须在样式生效前跑完，多一个网络往返

       两份必须一致——tests/test_theme_registry.cjs 会比对，改一处要改两处。 */
    (function(){
      try{
        var THEMES={courtyard:"day",dawn:"dawn",dusk:"dusk",night:"night",walnut:"dusk",contrast:"day"};
        var FALLBACK="courtyard";
        var LEGACY={mist:"dawn",grove:"courtyard",coral:"dusk",light:"dawn",dark:"night"};
        var root=document.documentElement;
        var read=function(key,allowed,fallback){
          var value=localStorage.getItem(key);
          return allowed.indexOf(value)>=0?value:fallback;
        };
        var theme=localStorage.getItem("companion-v2-theme")||"";
        theme=LEGACY[theme]||theme;
        root.dataset.theme=Object.prototype.hasOwnProperty.call(THEMES,theme)?theme:FALLBACK;
        root.dataset.density=read("companion-v2-density",["compact","standard","roomy"],"standard");
        root.dataset.radius=read("companion-v2-radius",["sharp","standard","round"],"standard");
        root.dataset.typeScale=read("companion-v2-type-scale",["s","m","l","xl"],"m");
        root.dataset.motion=read("companion-v2-motion",["full","low","off"],"full");
        /* 主题已在样式生效前写好，可以放行首屏。
           在此之前 body 保持 visibility:hidden，不出现默认主题一闪。 */
        root.dataset.themeReady="";
      }catch(_){document.documentElement.dataset.themeReady="";}
    })();

    <script>
        (function(){
          var root=document.documentElement;
          var source=root.dataset.roomBootGif;
          var image=document.getElementById("roomBootGif");
          var templates=document.querySelectorAll("template[data-room-boot-gif]");
          if(!source||!image||templates.length<2)return;
          var images=[];
          for(var i=0;i<templates.length;i++){
            var candidate=templates[i].content&&templates[i].content.firstElementChild;
            if(candidate)images.push({source:templates[i].getAttribute("data-room-boot-gif"),image:candidate});
          }
          var current=images.findIndex(function(item){return item.source===source;});
          if(current<0)return;
          var candidate=images[current].image;
          var preload=document.createElement("link");
          preload.rel="preload";
          preload.as="image";
          preload.href=candidate.src;
          preload.setAttribute("fetchpriority","low");
          document.head.appendChild(preload);
          var clone=candidate.cloneNode(true);
          clone.id=image.id;
          clone.hidden=false;
          image.replaceWith(clone);
          image=clone;
          function playNext(){
            if(root.hasAttribute("data-room-ready"))return;
            var next=(current+1)%images.length;
            var candidate=images[next].image;
            var probe=new Image();
            probe.onload=function(){
              if(root.hasAttribute("data-room-ready"))return;
              var nextImage=candidate.cloneNode(true);
              nextImage.id="roomBootGif";
              nextImage.hidden=false;
              image.replaceWith(nextImage);
              image=nextImage;
              current=next;
              root.dataset.roomBootGif=images[current].source;
              window.setTimeout(playNext,1900);
            };
            probe.onerror=function(){window.setTimeout(playNext,1900);};
            probe.src=candidate.src;
          }
          window.setTimeout(playNext,1900);
        })();
    </script>

  <!-- 外壳布局：小屋常驻 + 左栏 + 右栏 + 下方面板。必须在 styles.css 之后，

  <!-- 小屋就绪闸门（见 tokens.css）。
       体素包 677 KB，它是首屏唯一一个「到了才能画」的资源：在它解析完之前，
       app.js 的 mountStage() 不会执行，.room-stage 是个空盒子。所以在这一行
       上挂 onload 只忆下资源已到，并留一个 7 秒兜底——加载失败时不能让页面一直白着，
       到期放行，由 mountStage() 的 catch 走降级视图。
       onload 必须写在这一行本身：defer 脚本按文档顺序执行，换成在末尾统一
       绑定的话，包可能在监听挂上之前就已经加载完了（缓存命中时几乎必然如此），
       那放行就永远等不到。 -->
  <!-- 页面桥 SDK 不在这里静态引入。
       `AstrBotPluginPage` 由宿主的页面桥脚本定义，但不同宿主对它的扩展式
       不一样：有的在重写 HTML 时自动补这条脚本，有的要页面自己引。静态引
       一遍会在自动注入的宿主里加载两次。
       所以改由 product-page.js 的 requestBridgeSdk() 处理：先等，等不到再自己
       拉进来，两种情况都成立。见那里的注释。
       注意：这里**不能写出桥脚本的完整路径**。宿主注入前会先判断 HTML 里有没有
       这个字符串，有就跳过注入；而它注入的那条带 asset_token，页面自己猜的候选
       地址不带，端点无 token 直接 401。写在这里会让宿主跳过注入、页面又拉不到，
       整页连不上桥。 -->
  <!-- 体素包 677 KB，是首屏唯一「到了才画得出小屋」的资源：在它解析完之前
       mountStage() 不会执行，入场序列也就无从开始。预声明让它与 HTML 同时
       开始下载，而不是排在 lucide 之后才轮到——代价只是多一条 link。
       地址（含 ?v=）必须与下面那条 script 完全一致，否则会被当成两个资源，
       反而下载两遍。 -->
  <script>
    /* 兜底放行。
     *
     * 普通开场约 2830ms，状态页搭建约 3830ms；这里留 7 秒余量。
     *
     * 注意「放行」的语义已经在 2026-09-30 改过：它不再由入场**结束**触发，
     * 而是由入场**启动**触发（见 app.js 的 startEntrance）。现在这条只在
     * 入场根本没启动时兜底——体素包拦截、尺寸不可测、脚本缺失——那时
     * 页面已经在启动幕上停着了，所以要给宽，宁可多等两秒也不要卡在看不见
     * 的界面上。
     *
     * 正常路径不走这里：入场启动后 app.js 的 ready 回调会放行，
     * settleEntrance() 只负责收尾并再次幂等写入。
     * 这条只在入场根本没启动（体素包没到、尺寸不可测、入口脚本缺失）时兜底，
     * 所以宁可给宽——卡在一个看不见的界面上比多等两秒糟得多。 */
    setTimeout(function(){document.documentElement.dataset.roomReady="";},7000);
  </script>

      <section class="stage-region" aria-label="小屋">
        <div class="home-environment home-only" data-home-environment aria-label="角色地点、天气与当地时间"></div>
        <div class="room-stage" id="stageScene">
          <div id="stageRole" class="stage-role" aria-live="polite"><h2 class="stage-role-title"><i data-lucide="house" aria-hidden="true"></i><span>陪伴的小屋</span></h2></div>
          <div class="voxel-room" data-voxel-room role="group" aria-label="可旋转、可点选家具的体素小屋"></div>
          <!-- 镜头复位与家具布置常驻场景右上角：它们只作用于小屋本身，
               放进容器才不会在速览条移到下方后显得无处安放。 -->
          <div class="stage-overlay home-only">
            <button class="stage-overlay-button" data-voxel-reset title="镜头复位，回到小屋全景"><i data-lucide="rotate-ccw"></i>重置</button>
            <button class="stage-overlay-button" data-detail="arrange" title="布置房间"><i data-lucide="armchair"></i>布置</button>
          </div>
          <!-- 缩略态不再另放一颗「回到小屋」：小屋本身可点、可聚焦（app.js 给它
               role=button 与 aria-label），面板标题栏里也有一颗带文字的。
               原来这里第三颗按钮压在 196×118 的画中画上，三个入口说同一件事。 -->
          <div class="voxel-hint home-only"><i data-lucide="mouse"></i>拖动旋转 · 滚轮缩放 · 点击家具查看</div>
        </div>
        <div class="stage-furniture-strip home-only" id="stageFurniture" aria-label="小屋家具"></div>
      </section>
      <aside class="shell-side" id="shellSide" tabindex="-1" aria-label="此刻的状态与今日安排"></aside>
      <section class="shell-panel" id="shellPanel" tabindex="-1" aria-label="内容面板"></section>
    </div>
  </div>
  <!-- #main 保留：既有的路由渲染（人物、忆忆、专题配置）仍然写进这里，
       它现在是小屋下方面板区的另一处落点。 -->
  <main id="main" tabindex="-1" hidden></main>  <dialog id="detailDialog" class="detail-dialog" aria-labelledby="dialogTitle"><div id="dialogContent"></div></dialog>
  <dialog id="confirmationDialog" class="confirmation-dialog" aria-labelledby="confirmationTitle" aria-describedby="confirmationMessage" data-intent="normal">
    <div class="confirmation-copy"><span class="confirmation-mark" aria-hidden="true"><i data-lucide="circle-help"></i></span><div><h2 id="confirmationTitle">请确认此操作</h2><p id="confirmationMessage"></p><div id="confirmationDetails" class="confirmation-details" hidden></div><p id="confirmationStatus" class="confirmation-status" role="status" aria-live="polite" hidden></p></div></div>
    <div class="confirmation-actions"><button id="confirmationCancel" class="button small" type="button">取消</button><button id="confirmationAccept" class="button primary small" type="button">确认</button><button id="confirmationSave" class="button primary small" type="button" hidden>保存并切换</button></div>
  </dialog>
  <dialog id="searchDialog" class="search-dialog" aria-label="搜索功能与设置">
    <div class="search-field"><i data-lucide="search" aria-hidden="true"></i><input id="globalSearch" type="search" placeholder="搜索设置名称、用途或字段键…" aria-label="搜索功能与设置" aria-controls="searchResults" aria-autocomplete="list" autocomplete="off"><button class="icon-button" data-clear-search aria-label="清除搜索" hidden><i data-lucide="x"></i></button><button class="icon-button" data-close-search aria-label="关闭搜索"><i data-lucide="x"></i></button></div>
    <div class="search-controls"><div id="searchScope" class="search-scope" role="group" aria-label="搜索范围"><button type="button" data-search-filter="all" aria-pressed="true">全部<span data-search-filter-count></span></button><button type="button" data-search-filter="settings" aria-pressed="false">配置项<span data-search-filter-count></span></button><button type="button" data-search-filter="pages" aria-pressed="false">页面<span data-search-filter-count></span></button></div><span id="searchCount" class="search-count" role="status" aria-live="polite"></span></div>
    <div id="searchResults" class="search-results" role="listbox" aria-label="搜索结果"></div><div class="search-hint"><span>↑ ↓ 选择 · Enter 打开</span><kbd>Esc</kbd> 关闭</div>
  </dialog>
  <dialog id="navigationDialog" class="navigation-dialog" aria-labelledby="navigationTitle">
    <header class="navigation-dialog-head"><h1 id="navigationTitle">全部功能</h1><button class="icon-button" data-close-navigation aria-label="关闭导航"><i data-lucide="x"></i></button></header>
    <div id="navigationList" class="navigation-list"></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>

</body>
</html>
