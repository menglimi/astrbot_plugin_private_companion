function shown(cat){let c=cat.cards;if(cat.type==='mixed'){const v=views[cat.id]||cat.views[0][0];c=c.filter(x=>(x.view||'feature')===v)}if(activeType!=='all')c=c.filter(x=>x.type===activeType);return c}
function card(cat,c){const st=STATUS[c.status],ty=TYPE[c.type]||TYPE.view;return `<button class="card" data-card="${c.id}"><div class="ctop"><span class="cico ${ty[1]}">${icon(c.icon||cat.icon,17)}</span>${c.type==='feature'&&st?`<span class="status ${st[1]}"><span class="dot"></span>${st[0]}</span>`:`<span class="tag ${ty[1]}">${ty[0]}</span>`}</div><h3>${esc(c.title)}</h3><p class="desc">${esc(c.desc)}</p><div class="foot">${c.type==='data'&&c.metric?`<span class="metric">${esc(c.metric)}<small>${esc(c.meta)}</small></span>`:`<span>${esc(c.meta)}</span>`}<span class="arrow">→</span></div></button>`}
function sections(){q('#sections').innerHTML=CATS.map(cat=>{const cards=shown(cat);if(activeType!=='all'&&!cards.length)return '';const ty=TYPE[cat.type]||TYPE.view,mixed=cat.type==='mixed';const tabs=mixed?`<div class="tabs">${cat.views.map(([v,l])=>`<button class="tab ${((views[cat.id]||cat.views[0][0])===v)?'active':''}" data-view="${v}" data-sec="${cat.id}">${l}</button>`).join('')}</div>`:'';return `<section class="section" id="cat-${cat.id}"><div class="kicker"><span class="tag ${ty[1]}">${ty[0]}</span>${mixed?'<span class="tag view">资料 + 功能</span>':''}</div><div class="head"><span class="num">${cat.num}</span><h2>${esc(cat.title)}</h2><p>${esc(cat.desc)}</p></div>${tabs}${cards.length?`<div class="grid">${cards.map(c=>card(cat,c)).join('')}</div>`:`<div class="empty show" style="padding:16px 0">这个视图下还没有卡片。</div>`}</section>`}).join('');q('#statCards').textContent=all().length;q('#statCats').textContent=CATS.length;q('#empty').classList.toggle('show',!q('#sections').innerHTML.trim())}
function find(id){return all().find(x=>x.card.id===id)}
function control(f){if(f.type==='switch')return `<button class="switch" role="switch" aria-checked="${f.v===true}" data-switch="${f.k}" aria-label="${esc(f.label)}"></button>`;if(f.type==='select')return `<select data-field="${f.k}">${f.opts.map(o=>`<option ${o===f.v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;if(f.type==='range')return `<div class="range"><input type="range" min="${f.min||1}" max="${f.max||10}" value="${f.v}" data-range="${f.k}"><output>${f.v}</output></div>`;return `<input type="text" value="${esc(f.v)}" data-field="${f.k}">`}
function detailHTML(cat,c){const ty=TYPE[c.type]||TYPE.view,st=STATUS[c.status],isM=c.type==='material',isD=c.type==='data',isT=c.type==='tool';const bg=isM?'var(--blueSoft)':isD?'var(--amberSoft)':isT?'var(--redSoft)':'var(--greenSoft)',fg=isM?'var(--blue)':isD?'var(--amber)':isT?'var(--red)':'var(--green)';const scope=cat.id==='group'?'当前群聊':['private','proactive'].includes(cat.id)?'当前私聊':cat.id==='models'?'当前角色':'当前安装';const content=(c.content||[]).map(x=>`<div class="row"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('');const versions=(c.versions||[]).map(v=>`<div class="v"><b>${esc(v[0])}</b><span>${esc(v[1])}</span><span>${esc(v[2])}</span></div>`).join('');const settings=(c.settings||[]).map(f=>`<div class="field"><div><label>${esc(f.label)}</label><div class="help">${esc(f.help)}</div></div><div class="control">${control(f)}</div></div>`).join('');const adv=(c.advanced||[]).map(f=>`<div class="field"><div><label>${esc(f.label)}</label><div class="help">${esc(f.help)}</div></div><div class="control">${control(f)}</div></div>`).join('');const rel=(c.related||[]).map(x=>`<button data-rel="${x[0]}">${icon('spark',12)}<span>${esc(x[1])}</span><span class="arrow">→</span></button>`).join('');const actions=isM?`<button class="btn ghost">导出</button><button class="btn primary" data-act="save">编辑资料</button>`:isD?`<button class="btn" data-act="detail">查看明细</button>`:isT?`<button class="btn primary" data-act="run">运行诊断</button>`:`<button class="btn ghost" data-act="reset">恢复默认</button><button class="btn primary" data-act="save">保存</button>`;const right=c.type==='feature'&&st?`<span class="status ${st[1]}"><span class="dot"></span>${st[0]}</span>`:isM?'<span class="status">版本 3</span>':isD?'<span class="status">本月</span>':isT&&st?`<span class="status ${st[1]}"><span class="dot"></span>${st[0]}</span>`:`<span class="tag ${ty[1]}">${ty[0]}</span>`;return `<button class="back" data-back>← 返回功能地图</button><div class="dhead"><span class="dico" style="background:${bg};color:${fg}">${icon(c.icon||cat.icon,25)}</span><div><div class="dtype"><span class="tag ${ty[1]}">${ty[0]}</span><span>${cat.num} ${esc(cat.title)}</span></div><h1>${esc(c.title)}</h1><p>${esc(c.desc)}</p></div><div class="dstatus">${right}</div></div><div class="dgrid"><div><section class="panel"><h2>${isM?'这份资料是什么':isD?'这组数据是什么':isT?'这个工具做什么':'它是什么'}</h2><p>${esc(c.intro)}</p>${c.impacts?`<div class="impact">${c.impacts.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}</section>${isM?`<section class="panel"><h2>内容</h2><div class="contentlist">${content}</div></section><section class="panel"><h2>版本历史</h2><div class="versions">${versions||'<p class="muted">暂无版本记录。</p>'}</div></section>`:''}${isD?`<section class="panel"><h2>明细</h2><div class="contentlist">${content}</div></section>`:''}${isT?`<section class="panel"><h2>检查结果</h2><div class="contentlist">${content}</div></section>`:''}${!isM&&!isD&&!isT?`<section class="panel"><h2>它不会做什么</h2><p class="muted">不会改动其他功能的设置，也不会覆盖人格资料；需要跨功能调整时，请到对应入口。</p></section><section class="panel"><h2>基础设置</h2>${settings||'<p class="muted">这个功能没有可调整项。</p>'}${adv?`<details class="advanced"><summary>高级设置</summary>${adv}</details>`:''}</section>`:''}</div><aside><section class="panel"><h2>${isM?'当前版本':isD?'统计口径':isT?'当前状态':'当前状态'}</h2><dl class="sidelist">${isM?`<div class="row"><dt>版本</dt><dd>版本 3</dd></div><div class="row"><dt>来源</dt><dd>角色编辑</dd></div><div class="row"><dt>更新</dt><dd>2026-10-31 20:14</dd></div>`:isD?`<div class="row"><dt>周期</dt><dd>本月</dd></div><div class="row"><dt>趋势</dt><dd>较上月 +12%</dd></div>`:isT?`<div class="row"><dt>总体</dt><dd>正常</dd></div><div class="row"><dt>最近运行</dt><dd>今天 14:20</dd></div>`:`<div class="row"><dt>来源</dt><dd>角色「星缘」</dd></div><div class="row"><dt>生效范围</dt><dd>${scope}</dd></div><div class="row"><dt>最近更新</dt><dd>2026-10-31</dd></div>`}</dl></section>${rel?`<section class="panel"><h2>相关入口</h2><div class="related">${rel}</div></section>`:''}${isM?`<section class="panel"><h2>资料说明</h2><p class="muted">资料不会被启用或停用；它只被功能引用。修改资料会影响引用它的功能。</p></section>`:''}<div class="actionsrow"><a class="btn" href="${pageHref(SETTINGS[cat.id]||'./#life')}">去设置</a>${actions}</div></aside></div>`}
function open(id,focus){const x=find(id);if(!x)return;q('#crumb').innerHTML=`陪伴小屋 <b>/</b> ${esc(x.cat.title)} <b>/</b> ${esc(x.card.title)}`;q('#map').style.display='none';const d=q('#detail');d.innerHTML=detailHTML(x.cat,x.card);d.classList.add('show');window.scrollTo({top:0});if(focus)setTimeout(()=>{const t=d.querySelector(`[data-field="${focus}"],[data-switch="${focus}"],[data-range="${focus}"]`);if(t){t.closest('.field').scrollIntoView({block:'center'});t.focus?.();t.closest('.field').classList.add('focus-field')}},80)}
function close(){q('#crumb').innerHTML='陪伴小屋 <b>/</b> 功能地图';q('#detail').classList.remove('show');q('#detail').innerHTML='';q('#map').style.display=''}
function toast(m){const t=q('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t.t);t.t=setTimeout(()=>t.classList.remove('show'),1700)}
const searchData=()=>all().flatMap(({cat,card})=>[{cat,card,type:'card',text:`${card.title} ${card.desc} ${cat.title}`},...(card.settings||[]).map(f=>({cat,card,field:f,type:'field',text:`${f.label} ${f.help} ${card.title} ${cat.title}`}))]);
function search(v){const ws=v.toLowerCase().trim().split(/\s+/).filter(Boolean);const l=searchData().filter(x=>!ws.length||ws.every(w=>x.text.toLowerCase().includes(w))).slice(0,15);q('#searchResults').innerHTML=l.length?l.map(x=>`<button class="pitem" data-scard="${x.card.id}" data-sfield="${x.field?.k||''}"><span class="pico">${icon(x.card.icon||x.cat.icon,14)}</span><span class="pmain"><b>${esc(x.type==='field'?x.field.label:x.card.title)}</b><small>${esc(x.type==='field'?`${x.card.title} · ${x.field.help}`:x.card.desc)}</small></span><span class="ptype">${x.type==='field'?'设置':(TYPE[x.card.type]||TYPE.view)[0]}</span></button>`).join(''):`<div class="pempty">没有找到“${esc(v)}”。试试功能名、资料名或设置名。</div>`}
function readLive(){const node=q('#liveState');if(!node)return;let live=null;try{live=JSON.parse(localStorage.getItem('companion-catalog-snapshot')||'null')}catch{}if(!live){node.textContent='设计预览 · 尚未读取小屋状态';return}const running=live.state==='running';const parts=[running?'小屋运行中':'小屋状态未知'];if(Number.isFinite(live.private_targets)&&live.private_targets)parts.push(`${live.private_targets} 个私聊`);if(Number.isFinite(live.group_targets)&&live.group_targets)parts.push(`${live.group_targets} 个群聊`);if(Number.isFinite(live.roles)&&live.roles)parts.push(`${live.roles} 个角色`);if(live.updatedAt)parts.push(new Date(live.updatedAt).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+' 更新');node.dataset.state=running?'running':'offline';node.innerHTML=`<span class="live-dot"></span><span>${esc(parts.join(' · '))}</span>`}
window.addEventListener('storage',event=>{if(event.key==='companion-catalog-snapshot')readLive()});
function init(){readLive();nav();filters();sections();const back=q('#backHome');if(back)back.href=pageHref('./#life');q('#themeBtn').innerHTML=document.documentElement.dataset.theme==='dark'?icon('spark',16):icon('eye',16);q('#filters').onclick=e=>{const b=e.target.closest('[data-type]');if(b){activeType=b.dataset.type;filters();sections()}};q('#sections').onclick=e=>{const v=e.target.closest('[data-view]');if(v){views[v.dataset.sec]=v.dataset.view;sections();return}const c=e.target.closest('[data-card]');if(c)open(c.dataset.card)};[q('#navA'),q('#navB'),q('#navC')].forEach(n=>n.onclick=e=>{const b=e.target.closest('[data-cat]');if(!b)return;close();document.getElementById('cat-'+b.dataset.cat)?.scrollIntoView({behavior:'smooth',block:'start'});q('#sidebar').classList.remove('open')});q('#detail').onclick=e=>{if(e.target.closest('[data-back]'))return close();const r=e.target.closest('[data-rel]');if(r)return open(r.dataset.rel);const s=e.target.closest('[data-switch]');if(s){s.setAttribute('aria-checked',s.getAttribute('aria-checked')!=='true');toast('原型预览：设置未保存');return}const rg=e.target.closest('[data-range]');if(rg){rg.parentElement.querySelector('output').textContent=rg.value;return}const a=e.target.closest('[data-act]');if(a)toast(a.dataset.act==='save'?'原型预览：已保存':a.dataset.act==='run'?'原型预览：诊断已运行':'原型预览')};q('#searchBtn').onclick=()=>{q('#overlay').classList.add('show');q('#searchInput').value='';search('');setTimeout(()=>q('#searchInput').focus(),20)};q('#overlay').onclick=e=>{if(e.target===q('#overlay'))q('#overlay').classList.remove('show')};q('#searchInput').oninput=e=>search(e.target.value);q('#searchInput').onkeydown=e=>{if(e.key==='Escape')q('#overlay').classList.remove('show');if(e.key==='Enter'){e.preventDefault();q('#searchResults').querySelector('.pitem')?.click()}};q('#searchResults').onclick=e=>{const b=e.target.closest('[data-scard]');if(!b)return;q('#overlay').classList.remove('show');open(b.dataset.scard,b.dataset.sfield||'')};q('#menuBtn').onclick=()=>q('#sidebar').classList.toggle('open');q('#themeBtn').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';q('#themeBtn').innerHTML=r.dataset.theme==='dark'?icon('spark',16):icon('eye',16)};document.onkeydown=e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();q('#searchBtn').click()}if(e.key==='Escape'){if(q('#overlay').classList.contains('show'))q('#overlay').classList.remove('show');else if(q('#detail').classList.contains('show'))close()}};const p=new URLSearchParams(location.search);if(p.get('card'))setTimeout(()=>open(p.get('card'),p.get('field')||''),30)}
init();
</script>
